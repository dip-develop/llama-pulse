name: llama_pulse_workspace
description: LlamaPulse workspace root - shared tooling for the desktop app, the CLI and the core package.
publish_to: none
version: 0.1.0+1
homepage: https://github.com/dip-develop/llama-pulse
repository: https://github.com/dip-develop/llama-pulse
issue_tracker: https://github.com/dip-develop/llama-pulse/issues
topics:
  - llama
  - llamacpp
  - localinference
  - desktop
  - monorepo

environment:
  sdk: ^3.13.0

workspace:
  - packages/llama_pulse_core
  - apps/llama_pulse
  - apps/llama_pulse_cli

dev_dependencies:
  melos: ^8.10.0

# flutter_launcher_icons pins cli_util ^0.4.1 while melos needs 0.5+; it only
# uses cli_logging, whose API is identical across 0.4.2/0.5.0/0.6.0.
dependency_overrides:
  cli_util: ^0.6.0

melos:
  scripts:
    gen:
      description: Run build_runner in dependency order (core, then app).
      run: |
        set -e
        cd "$MELOS_ROOT_PATH/packages/llama_pulse_core" && dart run build_runner build
        cd "$MELOS_ROOT_PATH/apps/llama_pulse" && dart run build_runner build
    format:check:
      description: Fail if any Dart file is not formatted.
      run: dart format --output=none --set-exit-if-changed packages apps
    app:
      description: Run the desktop app on Linux.
      run: cd "$MELOS_ROOT_PATH/apps/llama_pulse" && flutter run -d linux
    app:stub:
      description: Run the desktop app with the synthetic stub engine.
      run: cd "$MELOS_ROOT_PATH/apps/llama_pulse" && flutter run -d linux --dart-define=LLAMAPULSE_STUB_ENGINE=true
    build:app:
      description: Build the Linux desktop release bundle.
      run: cd "$MELOS_ROOT_PATH/apps/llama_pulse" && flutter build linux --release
    build:cli:
      description: Compile the CLI to a native executable.
      run: cd "$MELOS_ROOT_PATH/apps/llama_pulse_cli" && dart compile exe bin/llamapulse.dart -o build/llamapulse
    check:
      description: Local gate - gen, analyze, test, format check, CLI build.
      run: |
        set -e
        dart run melos run gen
        dart run melos analyze
        dart run melos test
        dart run melos run format:check
        dart run melos run build:cli
