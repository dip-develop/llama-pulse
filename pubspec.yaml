name: llama_pulse
description: Minimal, fast desktop app for running local LLMs through llama.cpp.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  built_value: 8.13.0
  built_collection: ^5.1.2
  shared_preferences: ^2.5.6
  hive_ce: ^2.22.0
  ffi: ^2.2.0
  path: ^1.9.1
  file_selector: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.16.1
  built_value_generator: 8.13.0
  injectable_generator: 3.1.3
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

flutter:
  uses-material-design: true
