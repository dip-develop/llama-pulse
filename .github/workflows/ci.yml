name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the previous run; the operator's
# merge to main still gets its own run because the ref differs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The baseline recorded in AGENT.md section 3.
  FLUTTER_VERSION: '3.47.7'

jobs:
  gate:
    name: Workspace gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Run the gate
        # gen, catalog drift, analyze, tests, format check and the CLI AOT
        # build. The same command the contributor guide requires before a PR.
        run: dart run melos run check
      - name: Fail on generated-file drift
        # `melos run gen` runs before this, so a stale .g.dart or catalog is a
        # diff here. Generated files are committed and must not drift.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::generated files drifted; run melos run gen and commit the result"
            exit 1
          fi
      - name: Install the Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build the Linux desktop app
        working-directory: apps/llama_pulse
        run: flutter build linux --debug
      - name: Package the Linux bundle
        # Exercises the packaging script against the bundle just built, with
        # no second build and without a runtime to copy.
        run: |
          tool/package_linux.sh \
            --skip-build \
            --bundle apps/llama_pulse/build/linux/x64/debug/bundle \
            --out dist
          tar -tzf dist/llama-pulse-*-linux-x64.tar.gz > /dev/null

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  windows:
    name: Compile the CLI (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Compile the CLI
        working-directory: apps/llama_pulse_cli
        run: dart run tool/build_cli.dart

  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Build the desktop app
        working-directory: apps/llama_pulse
        run: flutter build ${{ matrix.target }} --release
      - name: Check the bundle layout
        # Stages into a temporary directory and verifies the required entries
        # for the target without writing an archive.
        run: >-
          dart run packages/llama_pulse_core/tool/package_app.dart
          --os ${{ matrix.target }} --skip-build --check --out dist
      - name: Write the archive
        run: >-
          dart run packages/llama_pulse_core/tool/package_app.dart
          --os ${{ matrix.target }} --skip-build --out dist
      - name: Verify the archive (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist/verify
          $exe = Get-ChildItem dist/verify -Recurse -Filter llama_pulse.exe |
            Select-Object -First 1
          if (-not $exe) {
            throw 'llama_pulse.exe is missing from the archive'
          }
      - name: Verify the archive (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -x -k dist/*.zip dist/verify
          app=$(find dist/verify -name llama_pulse.app -maxdepth 3 | head -n 1)
          test -x "$app/Contents/MacOS/llama_pulse"
          codesign --verify --deep --strict "$app"
      - name: Check the app is not sandboxed (macOS)
        if: matrix.target == 'macos'
        run: |
          built=apps/llama_pulse/build/macos/Build/Products/Release/llama_pulse.app
          test -d "$built"
          entitlements=$(codesign -d --entitlements :- "$built" 2>/dev/null) || {
            echo "cannot read entitlements from $built" >&2
            exit 1
          }
          if printf '%s' "$entitlements" | grep -q com.apple.security.app-sandbox; then
            echo "the built app is still sandboxed" >&2
            exit 1
          fi
      - name: Upload the archive
        if: >-
          github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: llama-pulse-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 7
