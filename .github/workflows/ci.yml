name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch supersedes the previous run; the operator's
# merge to main still gets its own run because the ref differs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The baseline recorded in AGENT.md section 3.
  FLUTTER_VERSION: '3.47.7'

jobs:
  gate:
    name: Workspace gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Run the gate
        # gen, catalog drift, analyze, tests, format check and the CLI AOT
        # build. The same command the contributor guide requires before a PR.
        run: dart run melos run check
      - name: Fail on generated-file drift
        # `melos run gen` runs before this, so a stale .g.dart or catalog is a
        # diff here. Generated files are committed and must not drift.
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::generated files drifted; run melos run gen and commit the result"
            exit 1
          fi
      - name: Install the Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Build the Linux desktop app
        working-directory: apps/llama_pulse
        run: flutter build linux --debug
      - name: Package the Linux bundle
        # Exercises the packaging script against the bundle just built, with
        # no second build and without a runtime to copy.
        run: |
          tool/package_linux.sh \
            --skip-build \
            --bundle apps/llama_pulse/build/linux/x64/debug/bundle \
            --out dist
          tar -tzf dist/llama-pulse-*-linux-x64.tar.gz > /dev/null

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Analyze
        run: dart run melos analyze
      - name: Test
        run: dart run melos test

  windows:
    name: Compile the CLI (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Compile the CLI
        working-directory: apps/llama_pulse_cli
        run: dart run tool/build_cli.dart

  package:
    name: Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: macos }
          - { os: windows-latest, target: windows }
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve the workspace
        run: flutter pub get
      - name: Build the desktop app
        working-directory: apps/llama_pulse
        run: flutter build ${{ matrix.target }} --release
      - name: Check the bundle layout
        # Stages into a temporary directory and verifies the required entries
        # for the target without writing an archive.
        run: >-
          dart run packages/llama_pulse_core/tool/package_app.dart
          --os ${{ matrix.target }} --skip-build --check --out dist
      - name: Write the archive
        run: >-
          dart run packages/llama_pulse_core/tool/package_app.dart
          --os ${{ matrix.target }} --skip-build --out dist
      - name: Verify the archive (Windows)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath dist/verify
          $exe = Get-ChildItem dist/verify -Recurse -Filter llama_pulse.exe |
            Select-Object -First 1
          if (-not $exe) {
            throw 'llama_pulse.exe is missing from the archive'
          }
      - name: Verify the archive (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -x -k dist/*.zip dist/verify
          app=$(find dist/verify -name llama_pulse.app -maxdepth 3 | head -n 1)
          test -x "$app/Contents/MacOS/llama_pulse"
          codesign --verify --deep --strict "$app"
      - name: Check the app is not sandboxed (macOS)
        if: matrix.target == 'macos'
        run: |
          built=apps/llama_pulse/build/macos/Build/Products/Release/llama_pulse.app
          test -d "$built"
          entitlements=$(codesign -d --entitlements :- "$built" 2>/dev/null) || {
            echo "cannot read entitlements from $built" >&2
            exit 1
          }
          if printf '%s' "$entitlements" | grep -q com.apple.security.app-sandbox; then
            echo "the built app is still sandboxed" >&2
            exit 1
          fi
      - name: Build a fixture runtime (macOS)
        # A real Mach-O dylib makes `codesign --deep` sign nested code, not
        # just a resource; the layout and runtime.yaml mirror a managed
        # install. This is a deterministic fixture, not a downloaded archive.
        if: matrix.target == 'macos'
        run: |
          fixture="$RUNNER_TEMP/llama-pulse-fixture-runtime"
          runtime="$fixture/runtime/v0.8.0/metal"
          mkdir -p "$runtime"
          printf 'int llama_fixture;\n' |
            clang -dynamiclib -x c - -o "$runtime/libllama.dylib"
          cp "$runtime/libllama.dylib" "$runtime/libggml-metal.dylib"
          printf '#!/bin/sh\nexit 0\n' > "$runtime/llama-server"
          chmod +x "$runtime/llama-server"
          cat > "$runtime/runtime.yaml" <<'YAML'
          schemaVersion: 1
          tag: v0.8.0
          build: b11960
          commit: 8642541b255bfb5dc39cd351a178be09013a55d6
          backend: metal
          platform: macos-arm64
          assetName: llama-b11960-bin-macos-arm64.tar.gz
          sha256: 58e5a5e1d7c2bf66cedd9c29e0323f3e570660a70a1e2156d32eed08f4cc1e3c
          sizeBytes: 16465074
          installedAtEpochMs: 1767225600000
          llamaVersion: 0.8.0-dev
          buildNumber: 11960
          files: 12
          YAML
      - name: Package a runtime-bearing bundle (macOS)
        if: matrix.target == 'macos'
        run: >-
          dart run packages/llama_pulse_core/tool/package_app.dart
          --os macos --skip-build
          --config-dir "$RUNNER_TEMP/llama-pulse-fixture-runtime"
          --runtime v0.8.0 metal
          --out dist-runtime
      - name: Verify the runtime-bearing bundle (macOS)
        if: matrix.target == 'macos'
        run: |
          ditto -x -k dist-runtime/*.zip dist-runtime/verify
          app=$(find dist-runtime/verify -name llama_pulse.app -maxdepth 3 | head -n 1)
          test -n "$app"
          runtime="$app/Contents/Resources/runtime/v0.8.0/metal"
          for file in llama-server libllama.dylib libggml-metal.dylib runtime.yaml; do
            test -f "$runtime/$file" || {
              echo "missing $runtime/$file in the runtime-bearing bundle" >&2
              exit 1
            }
          done
          test -x "$app/Contents/MacOS/llama_pulse"
          codesign --verify --deep --strict "$app"
          entitlements=$(codesign -d --entitlements :- "$app" 2>/dev/null) || {
            echo "cannot read entitlements from $app" >&2
            exit 1
          }
          if printf '%s' "$entitlements" | grep -q com.apple.security.app-sandbox; then
            echo "the runtime-bearing app is still sandboxed" >&2
            exit 1
          fi
          echo "runtime-bearing bundle verified: $app"
          ls -l "$runtime"
      - name: Upload the archive
        if: >-
          github.ref == 'refs/heads/main' ||
          github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: llama-pulse-${{ matrix.target }}
          path: dist/*.zip
          retention-days: 7
