    reason: "The dashboard needs the Prometheus endpoint, so it is always enabled."
  - id: slots
    owner: null
    managedBy: "LlamaPulse supervisor"
    reason: "The dashboard reads slot state, so the slots endpoint is always enabled."

removed:
  - id: draft
    replacement: "--spec-draft-n-max or --spec-ngram-mod-n-max"
    reason: "Upstream removed --draft in favour of the explicit speculative-decoding flags."
  - id: draft-min
    replacement: "--spec-draft-n-min or --spec-ngram-mod-n-min"
    reason: "Upstream removed --draft-min in favour of the explicit speculative-decoding flags."
  - id: spec-ngram-size-n
    replacement: "--spec-ngram-simple-size-n, --spec-ngram-map-k-size-n or --spec-ngram-map-k4v-size-n"
    reason: "Upstream split the generic ngram size into per-method flags."
  - id: spec-ngram-size-m
    replacement: "--spec-ngram-simple-size-m, --spec-ngram-map-k-size-m or --spec-ngram-map-k4v-size-m"
    reason: "Upstream split the generic ngram size into per-method flags."
  - id: spec-ngram-min-hits
    replacement: "--spec-ngram-simple-min-hits, --spec-ngram-map-k-min-hits or --spec-ngram-map-k4v-min-hits"
    reason: "Upstream split the generic ngram hit count into per-method flags."
  - id: defrag-thold
    replacement: null
    reason: "Deprecated upstream; KV cache defragmentation is automatic, so no replacement flag is needed."

unsupported:
  - reason: "Prints information and exits; a supervised server never returns from it."
    ids:
      - help
      - version
      - cache-list
      - completion-bash
      - list-devices
  - reason: "CLI client mode: connects to another server instead of hosting one."
    ids:
      - server-base
  - reason: "CLI diagnostics only; llama-server does not print these reports."
    ids:
      - show-timings
  - reason: "Lookup-decoding tool only; llama-server does not use it."
    ids:
      - lookup-cache-static
      - lookup-cache-dynamic
  - reason: "Perplexity and evaluation tool only; llama-server does not run it."
    ids:
      - hellaswag
      - hellaswag-tasks
      - winogrande
