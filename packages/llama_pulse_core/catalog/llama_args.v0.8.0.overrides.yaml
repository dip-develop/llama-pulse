  - reason: "Batched-bench tool only; llama-server does not report these scores."
    ids:
      - npp
      - ntg
      - npl
      - pps
      - tgs
  - reason: "Imatrix tool only; llama-server does not collect statistics."
    ids:
      - output
      - output-frequency
