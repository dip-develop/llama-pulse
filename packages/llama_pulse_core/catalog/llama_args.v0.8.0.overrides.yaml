# Reviewed overrides for the generated llama.cpp parameter catalog.
#
# The generator reads this file, merges it with the parsed vendored
# common/arg.cpp, and writes catalog/llama_args.v0.8.0.yaml. Edit this file,
# then run from the core package:
#   dart run tool/args/generate_catalog.dart
#
# Classification rules:
# - exposure defaults to configurable; this file lists everything else.
# - managed: LlamaPulse owns the value and always passes it.
# - unsupported: llama-server accepts the flag but LlamaPulse does not expose
#   it, either because it belongs to another llama.cpp tool or because it is
#   a per-request/interactive concern. Every entry has a reason.
# - removed: upstream removed the flag; the reason (and a replacement when
#   one exists) is required.
# - groupMap lists every configurable parameter and every managed parameter,
#   which keeps its functional group. The generator fails if one is missing.

schemaVersion: 1

