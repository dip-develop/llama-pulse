      - save-frequency
      - process-output
      - nextn
      - context-file
      - chunk-size
      - chunk-separator
      - junk
      - pos
      - show-statistics
  - reason: "Embedding and retrieval tool output only; the server has its own JSON protocol."
    ids:
      - embd-normalize
      - embd-output-format
      - embd-separator
      - cls-separator
      - in-file
  - reason: "Embedding tool only; llama-server does not accept this launch setting."
    ids:
      - attention
  - reason: "Tokenize tool only; the server tokenizes chat requests itself."
    ids:
      - ids
      - parse-special
      - no-parse-special
      - show-count
      - stdin
  - reason: "Diffusion (image generation) tool only."
    ids:
      - diffusion-steps
      - diffusion-visual
      - diffusion-eps
      - diffusion-algorithm
      - diffusion-alg-temp
      - diffusion-block-length
      - diffusion-cfg-scale
      - diffusion-add-gumbel-noise
      - positive-file
      - negative-file
      - pca-batch
      - pca-iter
      - method
  - reason: "Text-to-speech tool only."
    ids:
      - tts-lang
      - tts-voice
      - tts-speaker-file
  - reason: "Training tool only; llama-server does not train."
    ids:
      - learning-rate
      - learning-rate-min
      - learning-rate-decay-epochs
      - weight-decay
      - val-split
      - epochs
      - optimizer
      - check
      - save-logits
      - logits-output-dir
      - tensor-filter
  - reason: "Completion/passkey and fit tool only; llama-server does not use it."
    ids:
      - grp-attn-n
      - grp-attn-w
      - fit-print
  - reason: "Parallel-decoding tool only; llama-server has no counterpart."
    ids:
      - sequences
  - reason: "Preloads a media file for the CLI; llama-server accepts media per request."
    ids:
      - image
  - reason: "Downloads or resolves a model from the internet; the supervisor expects an existing local file."
    ids:
      - model-url
      - docker-repo
      - hf-repo
      - hf-file
      - hf-token
      - offline
      - mtp
      - dflash
      - eagle3
      - spec-draft-hf
  - reason: "Fixture shortcut: rewrites several parameters and downloads weights."
    ids:
      - embd-gemma-default
      - fim-qwen-1.5b-default
      - fim-qwen-3b-default
      - fim-qwen-7b-default
      - fim-qwen-7b-spec
      - fim-qwen-14b-spec
      - fim-qwen-30b-default
      - gpt-oss-20b-default
      - gpt-oss-120b-default
      - vision-gemma-4b-default
      - vision-gemma-12b-default
      - spec-default
  - reason: "Speculative-decoding tool only; llama-server does not accept this flag."
    ids:
      - spec-draft-cpu-range-batch
  - reason: "Interactive or single-shot CLI prompt handling; llama-server takes prompts per request."
    ids:
      - prompt
      - system-prompt
      - system-prompt-file
      - file
      - binary-file
      - reverse-prompt
      - prompt-cache
      - prompt-cache-all
      - prompt-cache-ro
      - conversation
      - single-turn
      - interactive
      - interactive-first
      - multiline-input
      - in-prefix
      - in-prefix-bos
      - in-suffix
      - escape
      - print-token-count
      - special
      - verbose-prompt
      - display-prompt
      - color
      - simple-io
      - spm-infill
      - no-bos
      - warmup

curated:
  model:
    displayName: "Model file"
    summary: "GGUF model file served by llama-server."
    description: "Path to the GGUF model to load. LlamaPulse manages this value from ServerConfig.modelPath."
    type: "path"
    owner: "modelPath"
    requiresExistingPath: true
  ctx-size:
    displayName: "Context size"
    summary: "Prompt context window in tokens."
    description: "Number of tokens in the KV cache. 0 loads the trained context size from the model. Larger values use more memory on every slot."
    type: "int"
    defaultValue: 0
    min: 0
    step: 256
    owner: "contextSize"
  threads:
    displayName: "Generation threads"
    summary: "CPU threads used during generation."
    description: "Worker threads for token generation. 0 or a negative value uses the hardware concurrency reported by the OS."
    type: "int"
    min: 0
    owner: "threads"
  gpu-layers:
    displayName: "GPU layers"
    summary: "Layers offloaded to the GPU."
    description: "Number of model layers kept in VRAM. Use 0 for CPU-only inference or a number up to the model's layer count; llama.cpp v0.8.0 also accepts 'auto' and 'all'."
    type: "string"
    owner: "gpuLayers"
  parallel:
    displayName: "Parallel slots"
    summary: "Server slots that can process requests concurrently."
    description: "Number of request slots. -1 lets llama.cpp choose from the context size; every slot splits the context budget."
    type: "int"
    defaultValue: -1
    min: -1
    owner: "parallelSlots"
  batch-size:
    displayName: "Logical batch size"
    summary: "Maximum logical batch size."
    description: "Maximum number of tokens in a logical batch. Larger batches improve prompt throughput but use more memory."
    type: "int"
    defaultValue: 2048
    min: 1
    step: 64
  ubatch-size:
    displayName: "Physical batch size"
    summary: "Maximum physical batch size."
    description: "Maximum number of tokens in a physical batch, which bounds the compute buffer. It must not exceed the logical batch size."
    type: "int"
    defaultValue: 512
    min: 1
    step: 64
  flash-attn:
    displayName: "Flash attention"
    summary: "Flash-attention mode."
    description: "Enables flash attention, which reduces KV cache memory and speeds up long contexts. \"auto\" enables it when the backend supports it."
    type: "enum"
    defaultValue: "auto"
    allowed: [on, off, auto]
    owner: "flashAttention"
  host:
    displayName: "Bind address"
    summary: "Address llama-server listens on."
    description: "IP address to bind. 0.0.0.0 exposes the server on every interface; 127.0.0.1 keeps it local."
    type: "string"
    defaultValue: "127.0.0.1"
    owner: "host"
  port:
    displayName: "Port"
    summary: "TCP port llama-server listens on."
    description: "Port for the OpenAI-compatible HTTP API and the dashboard metrics."
    type: "int"
    defaultValue: 8080
    min: 1
    max: 65535
    owner: "port"
  api-key:
    displayName: "API key"
    summary: "Bearer token required from clients."
    description: "When set, every request must send this key as a bearer token. Leave empty to disable authentication."
    type: "string"
    owner: "apiKey"
    warning: "The key is stored in plain text in server.yaml."
  alias:
    displayName: "Model alias"
    summary: "Model name reported to clients."
    description: "Name returned by the models endpoint and shown to API clients."
    type: "string"
    owner: "modelAlias"
  temp:
    displayName: "Temperature"
    summary: "Sampling temperature."
    description: "Scales the logit distribution. 0 is greedy, higher values are more random. 0.8 is a general-purpose default."
    type: "double"
    defaultValue: 0.8
    min: 0
    max: 2
    step: 0.01
  top-k:
    displayName: "Top-k"
    summary: "Top-k sampling cutoff."
    description: "Keep only the k most likely tokens before sampling. 0 disables the cutoff."
    type: "int"
    defaultValue: 40
    min: 0
  top-p:
    displayName: "Top-p"
    summary: "Nucleus sampling probability mass."
    description: "Keep the smallest set of tokens whose cumulative probability reaches p. 1.0 disables the cutoff."
    type: "double"
    defaultValue: 0.95
    min: 0
    max: 1
    step: 0.01
  min-p:
    displayName: "Min-p"
    summary: "Minimum probability relative to the most likely token."
    description: "Drop tokens whose probability is below p times the probability of the best token. 0 disables the cutoff."
    type: "double"
    defaultValue: 0.05
    min: 0
    max: 1
    step: 0.01
  seed:
    displayName: "Seed"
    summary: "RNG seed for sampling."
    description: "Fixed seed makes sampling reproducible. -1 draws a random seed for every run."
    type: "int"
    defaultValue: -1
    min: -1
  repeat-penalty:
    displayName: "Repeat penalty"
    summary: "Penalty for repeated tokens."
    description: "Divides the probability of tokens that already appeared. 1.0 disables the penalty."
    type: "double"
    defaultValue: 1.0
    min: 0
    step: 0.01
  chat-template:
    displayName: "Chat template"
    summary: "Jinja chat template override."
    description: "Replaces the template stored in the model metadata. Leave empty to use the model default."
    type: "string"
  jinja:
    displayName: "Jinja templates"
    summary: "Use the Jinja chat template engine."
    description: "Renders chat templates with Jinja instead of the legacy parser. Needed for most modern chat models."
    type: "bool"
  grammar:
    displayName: "Grammar"
    summary: "BNF grammar that constrains generation."
    description: "Grammar in llama.cpp GBNF syntax. Mutually exclusive with a JSON schema."
    type: "string"
  cache-type-k:
    displayName: "KV cache type (K)"
    summary: "Data type for the key half of the KV cache."
    description: "Lower-precision cache types reduce memory at the cost of quality. f16 is the upstream default."
    type: "enum"
    defaultValue: "f16"
    allowed: [f32, f16, bf16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1]
  cache-type-v:
    displayName: "KV cache type (V)"
    summary: "Data type for the value half of the KV cache."
    description: "Lower-precision cache types reduce memory at the cost of quality. f16 is the upstream default."
    type: "enum"
    defaultValue: "f16"
    allowed: [f32, f16, bf16, q8_0, q4_0, q4_1, iq4_nl, q5_0, q5_1]
  mmproj:
    displayName: "Multimodal projector"
    summary: "Projector file for image and audio input."
    description: "Path to the mmproj file that lets a multimodal model accept media. Leave empty for text-only models."
    type: "path"
    requiresExistingPath: true
  load-mode:
    displayName: "Model load mode"
    summary: "How the model file is mapped into memory."
    description: "auto memory-maps unless a device cannot; none reads eagerly; mmap maps the file; mlock keeps it resident; mmap+mlock combines both."
    type: "enum"
    defaultValue: "auto"
    allowed: [auto, none, mmap, mlock, mmap+mlock]

  tts-lang:
    type: "string"
  lora-scaled:
    type: "string"
  control-vector-scaled:
    type: "string"
  hf-file:
    type: "string"

synthetic:
  - id: extra-args
    displayName: Extra arguments
    summary: Raw llama-server tokens appended after the managed arguments.
    description: The separator entry documents the passthrough convention. LlamaPulse stores the tokens in ServerConfig.extraArgs and appends them after its managed arguments.
    flags: ["--"]
    type: string
    arity: 0
    repeatable: true
    group: managed
    owner: extraArgs
    managedBy: ServerConfig.extraArgs
    reason: LlamaPulse appends ServerConfig.extraArgs after its managed arguments.

