name: llama_pulse
description: Minimal desktop app for running local LLMs through llama.cpp.
version: 0.1.0+1
publish_to: none
homepage: https://github.com/dip-develop/llama-pulse
repository: https://github.com/dip-develop/llama-pulse
issue_tracker: https://github.com/dip-develop/llama-pulse/issues
topics:
  - llama
  - llamacpp
  - localinference
  - desktop
  - flutter
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  built_collection: ^5.1.2
  built_value: 8.13.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  llama_pulse_core:
    path: ../../packages/llama_pulse_core

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: 2.16.1
  built_value_generator: 8.13.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: 3.1.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
