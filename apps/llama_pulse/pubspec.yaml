name: llama_pulse
description: Minimal desktop app for running local LLMs through llama.cpp.
version: 0.1.0+1
publish_to: none
homepage: https://github.com/dip-develop/llama-pulse
repository: https://github.com/dip-develop/llama-pulse
issue_tracker: https://github.com/dip-develop/llama-pulse/issues
topics:
  - llama
  - llamacpp
  - localinference
  - desktop
  - flutter
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  get_it: ^9.3.0
  injectable: ^3.0.0
  llama_pulse_core:
    path: ../../packages/llama_pulse_core

dev_dependencies:
  build_runner: 2.16.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: 3.1.3

flutter:
  uses-material-design: true
